server:
  port: ${APPLICATION_PORT:8089}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${AI_POSTGRES_DB:ai_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}

ai:
  provider:
    metadata:
      name: ${AI_PROVIDER_NAME:temporary-noop}
      model: ${AI_MODEL_NAME:not-configured}

outbox:
  publisher:
    enabled: ${AI_OUTBOX_PUBLISHER_ENABLED:true}
    adapter: ${AI_OUTBOX_PUBLISHER_ADAPTER:kafka}
    batch-size: ${AI_OUTBOX_PUBLISHER_BATCH_SIZE:20}
    max-retries: ${AI_OUTBOX_PUBLISHER_MAX_RETRIES:3}
    fixed-delay-millis: ${AI_OUTBOX_PUBLISHER_FIXED_DELAY_MILLIS:5000}
    kafka:
      enabled: ${AI_OUTBOX_PUBLISHER_KAFKA_ENABLED:true}
      bootstrap-servers: ${AI_OUTBOX_PUBLISHER_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}}
      topic: ${AI_OUTBOX_PUBLISHER_KAFKA_TOPIC:${KAFKA_AI_EVENTS_TOPIC:platform.ai-events}}
