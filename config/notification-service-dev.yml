server:
  port: ${APPLICATION_PORT:8087}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${NOTIFICATION_POSTGRES_DB:notifications_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}

notification:
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:true}
    topic: ${NOTIFICATION_KAFKA_TOPIC:${KAFKA_TASK_EVENTS_TOPIC:platform.task-events}}

outbox:
  publisher:
    enabled: ${NOTIFICATION_OUTBOX_PUBLISHER_ENABLED:true}
    adapter: ${NOTIFICATION_OUTBOX_PUBLISHER_ADAPTER:kafka}
    batch-size: ${NOTIFICATION_OUTBOX_PUBLISHER_BATCH_SIZE:20}
    max-retries: ${NOTIFICATION_OUTBOX_PUBLISHER_MAX_RETRIES:3}
    fixed-delay-millis: ${NOTIFICATION_OUTBOX_PUBLISHER_FIXED_DELAY_MILLIS:5000}
    kafka:
      enabled: ${NOTIFICATION_OUTBOX_PUBLISHER_KAFKA_ENABLED:true}
      bootstrap-servers: ${NOTIFICATION_OUTBOX_PUBLISHER_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}}
      topic: ${NOTIFICATION_OUTBOX_PUBLISHER_KAFKA_TOPIC:${KAFKA_NOTIFICATION_EVENTS_TOPIC:platform.notification-events}}
