spring:
  application:
    name: notification-service

notification:
  kafka:
    enabled: false
    topic: platform.task-events

outbox:
  publisher:
    enabled: false
    adapter: logging
    batch-size: 20
    max-retries: 3
    fixed-delay-millis: 5000
    kafka:
      enabled: false
      bootstrap-servers: kafka:9092
      topic: platform.notification-events
