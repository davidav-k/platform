spring:
  application:
    name: ai-service

ai:
  provider:
    metadata:
      name: temporary-noop
      model: not-configured

outbox:
  publisher:
    enabled: false
    adapter: logging
    batch-size: 20
    max-retries: 3
    fixed-delay-millis: 5000
    kafka:
      enabled: false
      bootstrap-servers: kafka:9092
      topic: platform.ai-events
